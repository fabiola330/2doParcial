<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassName</title>
</head>
<body>
   <p id="prueba">

   </p>
   <p id="ejemplo">

   </p>
   <h5 id="query">

   </h5>
   <h6 id="selector">

   </h6>
   <p class="all">

   </p>
   <p class="prac"></p>
   <script>
    let elemento= document.getElementById("prueba");
    elemento.innerHTML="Aprendiendo metodos de JavaScript";
    var prueba = document.getElementById("ejemplo");
    prueba.innerHTML="Soy floja ya que no hago tarea";
    let selector= document.querySelector("h5");
    selector.innerHTML="Voy a usar QuerySelector";
    let query = document.querySelector("h6");
    query.innerHTML="Sigo usando querySelector";
    let todo= document.querySelectorAll("#");
    todo.innerHTML="<br>Estoy usando un querySelectorAll";
    let m=document.querySelector(".prac");
    m.innerHTML="Si me salio";

   </script>
</body>
</html>
