<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let continuar = confirm("Desea agregar datos ☺???  ☺");
        
        if(continuar){
            let nombre = prompt('ingresa tu nombre');
            let edad= Number(prompt('Ingresa tu edad'));
            let especialidad = prompt('Ingresa tu especialidad');
            let correo = prompt('Ingresa correo electronico');
            document.write('tu nombre es: '+nombre + "<br>");
            document.write(`tiene: ${edad} años` + "<br>");
            document.write('Especialidad: '+especialidad);
            document.write('Correo: '+correo);
 
        }
        else{
            alert("tengo flojera");
        }


    </script>
</body>
</html>
