<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Datos</h1>
    <script>
        let nombre= prompt('Escribe tu nombre');
        let edad= prompt('Escribe tu edad');
        let especialidad= prompt('Escribe tu especialidad');
        let direccion= prompt('Escribe tu dirección');
        document.write("Nombre: "+ nombre + "<br>");
        document.write(`tiene: ${edad} años` + "<br>");
        document.write("Especialidad: " + especialidad + "<br>");
        document.write("Dirección: " + direccion);

       
    </script>
</body>
</html>
