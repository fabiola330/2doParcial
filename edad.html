<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Votaciones</title>
</head>
<body>
    <script>
        let continuar = confirm("¿Deseas votar?");
        let edad = Number(prompt("Ingresa tu edad"));

        if (continuar) {
            if (edad >= 18) {
                document.write("¡Felicidades, puedes votar!");
            } else {
                document.write("Aun no eres ciudadano, no puedes votar");
            }
        }
    </script>
</body>
