<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS</title>
</head>
<body>
    <h1>Suma</h1>
    <script>
        let n1= Number(prompt('intoduce el primer número'));
        let n2= Number(prompt('intoduce el segundo número'));
        suma=n1+n2;
        document.write("el valor es: "+suma + "<br>");

        resta=n1-n2;
        document.write("el valor es: "+resta + "<br>");

        multiply=n1*n2;
        document.write("el valor es: "+multiply + "<br>");

        division=n1/n2;
        document.write("el valor es: "+division);
    </script>
</body>
</html>
